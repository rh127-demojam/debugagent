# Lets the orchestrator (running as the 'default' ServiceAccount in
# debug-agent-hub) apply CFL/KCS tokens pasted into the Streamlit "Connect"
# popover directly to their backing Secrets in debug-agent-mcp, then force a
# rollout restart of that one MCP Deployment so the new Secret value is
# actually picked up (Secret-sourced env vars do NOT hot-reload in a running
# pod - only a ConfigMap VOLUME mount does, which is what team-config.json
# uses instead; see orchestrator-team-config-rbac.yaml for that one).
#
# This is a cross-namespace RoleBinding: the Role lives in debug-agent-mcp
# (where the Secrets/Deployments actually are), but its subject is the
# ServiceAccount from debug-agent-hub (where the orchestrator pod runs).
#
# Scoped to exactly the two named Secrets and two named Deployments this
# feature touches (CFL + KCS only) - deliberately NOT mcp-slack-creds or
# nbk-mcp-creds (Slack/NotebookLM use browser-session cookies / interactive
# Google OAuth, not a static token a user can safely paste into a web form -
# that's a materially different, larger feature, intentionally out of scope
# here) - and NOT any other object in the namespace.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: debug-agent-credentials-editor
  namespace: debug-agent-mcp
rules:
  - apiGroups: [""]
    resources: ["secrets"]
    resourceNames: ["confluence-mcp-creds", "redhat-kcs-mcp-creds"]
    verbs: ["get", "patch", "update"]
  - apiGroups: ["apps"]
    resources: ["deployments"]
    resourceNames: ["mcp-confluence-server", "mcp-redhat-kcs-server"]
    verbs: ["get", "patch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: debug-agent-credentials-editor-binding
  namespace: debug-agent-mcp
subjects:
  - kind: ServiceAccount
    name: default
    namespace: debug-agent-hub
roleRef:
  kind: Role
  name: debug-agent-credentials-editor
  apiGroup: rbac.authorization.k8s.io
