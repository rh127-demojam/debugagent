# Lets the orchestrator (running as the 'default' ServiceAccount in
# debug-agent-hub) apply credentials submitted via the Streamlit "Configure"
# popover directly to their backing Secrets in debug-agent-mcp, then force a
# rollout restart of that one MCP Deployment so the new Secret value is
# actually picked up (Secret-sourced env vars/volume mounts do NOT hot-reload
# in a running pod - only a ConfigMap VOLUME mount does, which is what
# team-config.json uses instead; see orchestrator-team-config-rbac.yaml for
# that one). Two submission shapes feed this, both landing on the same
# PATCH-secret-then-restart-deployment mechanism:
#   - CFL/KCS: paste-a-token form (POST /credentials/{source})
#   - SLK/NBK: upload-a-Secret-YAML form (POST /credentials/{source}/file) -
#     SLK/NBK creds are browser-session cookies / interactive Google OAuth,
#     not a value a user can safely type, so the UI has them upload the
#     Secret YAML produced by scripts/refresh-slack-creds.ps1 -Mode Export /
#     scripts/refresh-nbk-creds.ps1 -SkipLogin -Mode Export instead of a text
#     field - the backend handling converges on the exact same PATCH+restart
#     call as CFL/KCS once the YAML's key/value pairs are extracted.
#
# This is a cross-namespace RoleBinding: the Role lives in debug-agent-mcp
# (where the Secrets/Deployments actually are), but its subject is the
# ServiceAccount from debug-agent-hub (where the orchestrator pod runs).
#
# Scoped to exactly the four named Secrets and four named Deployments this
# feature touches - and NOT any other object in the namespace. The one
# exception is `create`: RBAC resourceNames restrictions only apply to verbs
# that act on an object that already exists (get/patch/update/delete) - a
# `create` request has no existing object to check a name against, so it
# can't be scoped to these four names the same way. On a genuinely fresh
# deploy, nbk-mcp-creds and mcp-slack-creds have no pre-created placeholder
# (unlike confluence-mcp-creds/redhat-kcs-mcp-creds via
# secrets.example.yaml), so the orchestrator's first credential upload must
# be able to create them outright, not just patch. This is still bounded to
# plain Secret creation in this one namespace (debug-agent-mcp), which is
# dedicated to MCP server credentials only.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: debug-agent-credentials-editor
  namespace: debug-agent-mcp
rules:
  - apiGroups: [""]
    resources: ["secrets"]
    resourceNames: ["confluence-mcp-creds", "redhat-kcs-mcp-creds", "mcp-slack-creds", "nbk-mcp-creds"]
    verbs: ["get", "patch", "update"]
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["create"]
  - apiGroups: ["apps"]
    resources: ["deployments"]
    resourceNames: ["mcp-confluence-server", "mcp-redhat-kcs-server", "mcp-slack-server", "nbk-mcp-server"]
    verbs: ["get", "patch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: debug-agent-credentials-editor-binding
  namespace: debug-agent-mcp
subjects:
  - kind: ServiceAccount
    name: default
    namespace: debug-agent-hub
roleRef:
  kind: Role
  name: debug-agent-credentials-editor
  apiGroup: rbac.authorization.k8s.io
