# Placeholder templates for every Secret/ConfigMap this app's manifests
# reference. NEVER apply this file as-is or commit real values into it -
# this is a SHAPE REFERENCE ONLY, nothing in this repo reads or auto-applies
# this specific file.
#
# To actually set real values, use manifests/secrets.local.env.example
# instead (copy to manifests/secrets.local.env, fill in, gitignored) plus
# scripts/apply-secrets-from-config.sh, which DOES read that file and
# create/update the real Secret/ConfigMap objects + restart the Deployments
# that consume them. This file remains useful as documentation of exactly
# which keys each object needs and why.
#
# ------------------------------------------------------------------
# 1) debug-agent-litemaas (namespace: debug-agent-hub)
#    Consumed by: manifests/orchestrator.yaml - see app.py:
#      client = OpenAI(base_url=f"{LITEMAAS_BASE_URL.rstrip('/')}/v1", api_key=LITEMAAS_API_KEY)
#      MODEL = os.environ["MODEL_NAME"]
#    This happens at Python import time, so the orchestrator pod CRASH-LOOPS
#    if any of these 3 are missing entirely - unlike Confluence/KCS, there is
#    no safe placeholder to auto-seed; you must provide a real endpoint.
#
#    A Secret AND a ConfigMap sharing the same name (different kinds, both
#    valid). LITEMAAS_BASE_URL/API_KEY/MODEL_NAME point at ANY OpenAI-API-
#    compatible endpoint - a LiteLLM/LiteMaaS gateway, OpenAI itself, Azure
#    OpenAI's compatible endpoint, or a local vLLM/Ollama server. The
#    source environment points at an external Red Hat demo "Models as a
#    Service" gateway specific to that workshop cluster - it will not work
#    for you; pick your own provider.
#
#    IMPORTANT: LITEMAAS_BASE_URL must NOT include a trailing /v1 - the code
#    appends it. e.g. for OpenAI itself, use "https://api.openai.com", not
#    ".../v1" (that would produce a broken .../v1/v1 path).
#
#    ATLASSIAN_OAUTH_* / CONFLUENCE_* in the Secret below are a second,
#    direct-REST-call credential set the orchestrator uses independently of
#    mcp-confluence-server (#3 below).
# ------------------------------------------------------------------
apiVersion: v1
kind: Secret
metadata:
  name: debug-agent-litemaas
  namespace: debug-agent-hub
type: Opaque
stringData:
  LITEMAAS_API_KEY: "__LITEMAAS_API_KEY__" # API key for whatever endpoint you set as LITEMAAS_BASE_URL below
  ATLASSIAN_OAUTH_CLIENT_ID: "__ATLASSIAN_OAUTH_CLIENT_ID__"
  ATLASSIAN_OAUTH_CLIENT_SECRET: "__ATLASSIAN_OAUTH_CLIENT_SECRET__"
  CONFLUENCE_EMAIL: "__CONFLUENCE_EMAIL__"
  CONFLUENCE_API_TOKEN: "__CONFLUENCE_API_TOKEN__"
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: debug-agent-litemaas
  namespace: debug-agent-hub
data:
  LITEMAAS_BASE_URL: "__LITEMAAS_BASE_URL__" # e.g. https://api.openai.com - NO trailing /v1 (the code appends it)
  MODEL_NAME: "__MODEL_NAME__" # a model your chosen endpoint actually serves, e.g. gpt-4o
---
# ------------------------------------------------------------------
# 2) redhat-kcs-mcp-creds (namespace: debug-agent-mcp)
#    Consumed by: manifests/kcs-mcp.yaml
#    Red Hat SSO offline/refresh token from
#    https://access.redhat.com/management/api (grant_type=refresh_token,
#    client_id=rhsm-api). See services/kcs-mcp/redhat_kcs_mcp.py.
#
#    scripts/deploy-fresh-environment.sh auto-seeds this with a
#    REPLACE_VIA_UI placeholder if missing, so the Deployment comes up and
#    the real token can then be set entirely through the Streamlit UI's
#    Connect popover (orchestrator's POST /credentials/KCS - PATCHes this
#    Secret + restarts mcp-redhat-kcs-server). No oc command required.
# ------------------------------------------------------------------
apiVersion: v1
kind: Secret
metadata:
  name: redhat-kcs-mcp-creds
  namespace: debug-agent-mcp
type: Opaque
stringData:
  RHKB_OFFLINE_TOKEN: "__RHKB_OFFLINE_TOKEN__"
---
# ------------------------------------------------------------------
# 3) confluence-mcp-creds (namespace: debug-agent-mcp)
#    Consumed by: manifests/confluence-mcp.yaml (mcp-atlassian image)
#    Personal API token: https://id.atlassian.com/manage-profile/security/api-tokens
#    CONFLUENCE_URL must include the /wiki suffix.
#
#    scripts/deploy-fresh-environment.sh auto-seeds this with REPLACE_ME /
#    REPLACE_VIA_UI placeholders if missing, so the Deployment comes up and
#    the real values can then be set entirely through the Streamlit UI's
#    Connect popover (orchestrator's POST /credentials/CFL - PATCHes this
#    Secret + restarts mcp-confluence-server). No oc command required.
# ------------------------------------------------------------------
apiVersion: v1
kind: Secret
metadata:
  name: confluence-mcp-creds
  namespace: debug-agent-mcp
type: Opaque
stringData:
  CONFLUENCE_URL: "https://your-domain.atlassian.net/wiki"
  CONFLUENCE_USERNAME: "you@example.com"
  CONFLUENCE_API_TOKEN: "__CONFLUENCE_API_TOKEN__"
  JIRA_URL: "https://your-domain.atlassian.net" # optional
---
# ------------------------------------------------------------------
# 4) mcp-slack-creds (namespace: debug-agent-mcp)
#    Consumed by: manifests/slack-mcp.yaml
#    Browser-session cookies (short-lived). Unlike NotebookLM below,
#    mcp-slack-server only reads these as plain env vars at request time -
#    no file-based bootstrap - so scripts/deploy-fresh-environment.sh
#    auto-seeds this with a REPLACE_VIA_SCRIPT placeholder if missing, same
#    as confluence-mcp-creds/redhat-kcs-mcp-creds, so the Deployment comes
#    up immediately. There's no UI paste flow for this one though (app.py's
#    POST /credentials/{source} only wires up CFL/KCS) - set the real value
#    with:
#      scripts/refresh-slack-creds.ps1 -Mode Apply [-KubeContext <ctx>]
#    which applies the Secret AND rolls out the restart in one step (the
#    terminal-driven equivalent of what the UI's Connect popover does for
#    CFL/KCS). DO NOT hand-author real values into this file - that script
#    (or -Mode Export for an out-of-band/bastion hand-off) is the only
#    supported path.
# ------------------------------------------------------------------
apiVersion: v1
kind: Secret
metadata:
  name: mcp-slack-creds
  namespace: debug-agent-mcp
type: Opaque
stringData:
  SLACK_XOXC_TOKEN: "__SLACK_XOXC_TOKEN__"
  SLACK_XOXD_TOKEN: "__SLACK_XOXD_TOKEN__"
---
# ------------------------------------------------------------------
# 5) nbk-mcp-creds (namespace: debug-agent-mcp)
#    Consumed by: manifests/nbk-mcp.yaml
#    A live Google/NotebookLM session (auth.json + profiles/default/
#    cookies.json + profiles/default/metadata.json), seeded once per pod
#    lifetime into an emptyDir by services/nbk-mcp/entrypoint.sh (a
#    Secret update alone does NOT propagate to an already-running pod -
#    force-delete the pod after applying a refreshed Secret). DO NOT
#    hand-author real values - generate and apply with:
#      nlm login                                  # interactive Google OAuth
#      scripts/refresh-nbk-creds.ps1 -SkipLogin -Mode Export -OutputPath <file>
#      oc apply -f <file>
#      oc -n debug-agent-mcp delete pod -l app=nbk-mcp-server
#    The shape below is for documentation only.
# ------------------------------------------------------------------
apiVersion: v1
kind: Secret
metadata:
  name: nbk-mcp-creds
  namespace: debug-agent-mcp
type: Opaque
stringData:
  auth.json: "__AUTH_JSON_CONTENT__"
  cookies.json: "__COOKIES_JSON_CONTENT__"
  metadata.json: "__METADATA_JSON_CONTENT__"
