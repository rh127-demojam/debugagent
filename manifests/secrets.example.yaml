# Placeholder templates for every Secret/ConfigMap this app's manifests
# reference. NEVER apply this file as-is or commit real values into it -
# replace every __PLACEHOLDER__ and apply with `oc create -f` (or
# `--from-literal`) directly against the cluster, outside git.
#
# ------------------------------------------------------------------
# 1) debug-agent-litemaas (namespace: debug-agent-hub)
#    Consumed by: manifests/orchestrator.yaml
#    A Secret AND a ConfigMap sharing the same name (different kinds, both
#    valid). LITEMAAS_* is the in-cluster LiteLLM/LiteMaaS gateway used for
#    query classification + RCA synthesis. ATLASSIAN_OAUTH_* / CONFLUENCE_*
#    here are a second, direct-REST-call credential set the orchestrator
#    uses independently of mcp-confluence-server (#3 below).
# ------------------------------------------------------------------
apiVersion: v1
kind: Secret
metadata:
  name: debug-agent-litemaas
  namespace: debug-agent-hub
type: Opaque
stringData:
  LITEMAAS_API_KEY: "__LITEMAAS_API_KEY__"
  ATLASSIAN_OAUTH_CLIENT_ID: "__ATLASSIAN_OAUTH_CLIENT_ID__"
  ATLASSIAN_OAUTH_CLIENT_SECRET: "__ATLASSIAN_OAUTH_CLIENT_SECRET__"
  CONFLUENCE_EMAIL: "__CONFLUENCE_EMAIL__"
  CONFLUENCE_API_TOKEN: "__CONFLUENCE_API_TOKEN__"
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: debug-agent-litemaas
  namespace: debug-agent-hub
data:
  LITEMAAS_BASE_URL: "http://litemaas-litellm.litemaas.svc.cluster.local:4000/v1" # adjust to your LiteLLM/LiteMaaS gateway
  MODEL_NAME: "__MODEL_NAME__" # e.g. gpt-4o, granite-3-8b-instruct
---
# ------------------------------------------------------------------
# 2) redhat-kcs-mcp-creds (namespace: debug-agent-mcp)
#    Consumed by: manifests/kcs-mcp.yaml
#    Red Hat SSO offline/refresh token from
#    https://access.redhat.com/management/api (grant_type=refresh_token,
#    client_id=rhsm-api). See services/kcs-mcp/redhat_kcs_mcp.py.
#
#    scripts/deploy-fresh-environment.sh auto-seeds this with a
#    REPLACE_VIA_UI placeholder if missing, so the Deployment comes up and
#    the real token can then be set entirely through the Streamlit UI's
#    Connect popover (orchestrator's POST /credentials/KCS - PATCHes this
#    Secret + restarts mcp-redhat-kcs-server). No oc command required.
# ------------------------------------------------------------------
apiVersion: v1
kind: Secret
metadata:
  name: redhat-kcs-mcp-creds
  namespace: debug-agent-mcp
type: Opaque
stringData:
  RHKB_OFFLINE_TOKEN: "__RHKB_OFFLINE_TOKEN__"
---
# ------------------------------------------------------------------
# 3) confluence-mcp-creds (namespace: debug-agent-mcp)
#    Consumed by: manifests/confluence-mcp.yaml (mcp-atlassian image)
#    Personal API token: https://id.atlassian.com/manage-profile/security/api-tokens
#    CONFLUENCE_URL must include the /wiki suffix.
#
#    scripts/deploy-fresh-environment.sh auto-seeds this with REPLACE_ME /
#    REPLACE_VIA_UI placeholders if missing, so the Deployment comes up and
#    the real values can then be set entirely through the Streamlit UI's
#    Connect popover (orchestrator's POST /credentials/CFL - PATCHes this
#    Secret + restarts mcp-confluence-server). No oc command required.
# ------------------------------------------------------------------
apiVersion: v1
kind: Secret
metadata:
  name: confluence-mcp-creds
  namespace: debug-agent-mcp
type: Opaque
stringData:
  CONFLUENCE_URL: "https://your-domain.atlassian.net/wiki"
  CONFLUENCE_USERNAME: "you@example.com"
  CONFLUENCE_API_TOKEN: "__CONFLUENCE_API_TOKEN__"
  JIRA_URL: "https://your-domain.atlassian.net" # optional
---
# ------------------------------------------------------------------
# 4) mcp-slack-creds (namespace: debug-agent-mcp)
#    Consumed by: manifests/slack-mcp.yaml
#    Browser-session cookies (short-lived, same risk class as NotebookLM's
#    cookies below). DO NOT hand-author real values - generate and apply
#    with:
#      scripts/refresh-slack-creds.ps1 -Mode Export -OutputPath <file>
#      oc apply -f <file>
#    The shape below is for documentation only.
# ------------------------------------------------------------------
apiVersion: v1
kind: Secret
metadata:
  name: mcp-slack-creds
  namespace: debug-agent-mcp
type: Opaque
stringData:
  SLACK_XOXC_TOKEN: "__SLACK_XOXC_TOKEN__"
  SLACK_XOXD_TOKEN: "__SLACK_XOXD_TOKEN__"
---
# ------------------------------------------------------------------
# 5) nbk-mcp-creds (namespace: debug-agent-mcp)
#    Consumed by: manifests/nbk-mcp.yaml
#    A live Google/NotebookLM session (auth.json + profiles/default/
#    cookies.json + profiles/default/metadata.json), seeded once per pod
#    lifetime into an emptyDir by services/nbk-mcp/entrypoint.sh (a
#    Secret update alone does NOT propagate to an already-running pod -
#    force-delete the pod after applying a refreshed Secret). DO NOT
#    hand-author real values - generate and apply with:
#      nlm login                                  # interactive Google OAuth
#      scripts/refresh-nbk-creds.ps1 -SkipLogin -Mode Export -OutputPath <file>
#      oc apply -f <file>
#      oc -n debug-agent-mcp delete pod -l app=nbk-mcp-server
#    The shape below is for documentation only.
# ------------------------------------------------------------------
apiVersion: v1
kind: Secret
metadata:
  name: nbk-mcp-creds
  namespace: debug-agent-mcp
type: Opaque
stringData:
  auth.json: "__AUTH_JSON_CONTENT__"
  cookies.json: "__COOKIES_JSON_CONTENT__"
  metadata.json: "__METADATA_JSON_CONTENT__"
